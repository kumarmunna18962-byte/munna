<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create DC Chat account</title><style>body{font:16px system-ui;background:#eaf2ef;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:white;padding:24px;border-radius:18px;width:min(390px,calc(100% - 40px));box-shadow:0 12px 40px #0002}h1{color:#075e54}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #ccd5d2;border-radius:9px;font:inherit}button{background:#087e6d;color:white;border:0;font-weight:700;cursor:pointer}#msg{font-size:14px;color:#b42318;white-space:pre-wrap}</style><div class="card"><h1>DC Chat</h1><h2>Create your account</h2><p>One-time account setup. Afterwards, use the main DC Chat Gmail + password login.</p><form id="f"><input id="name" placeholder="Display name" required maxlength="40"><input id="email" type="email" placeholder="Gmail address (@gmail.com)" required><input id="password" type="password" placeholder="Password (at least 8 characters)" minlength="8" required><button>Create DC Chat account</button></form><div id="msg" role="status"></div><script>f.onsubmit=async e=>{e.preventDefault();msg.style.color='#b42318';msg.textContent='Creating account…';try{let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,password:password.value})});let j=await r.json();if(!r.ok)throw Error(j.error||'Registration failed');msg.style.color='#087e6d';msg.textContent='Account created! Your DC UID: '+j.user.uid+'\nSave this UID. Now open DC Chat and log in.';f.reset()}catch(err){msg.textContent=err.message+'\nIf the server is not deployed, this page will not work.'}}</script></div></html>
