<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<meta name="description" content="DC Calculator — a polished, reliable everyday calculator.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./dc-icon.svg" type="image/svg+xml">
<title>DC Calculator</title>
<style>
:root{color-scheme:light;--bg:#f2f4f6;--panel:#fff;--panel-2:#f7f9fa;--screen:#fbfcfd;--text:#182329;--muted:#7b878e;--line:#e5eaed;--key:#edf1f3;--key-hover:#e2e8eb;--fn:#e2eeeb;--accent:#137a67;--accent-hi:#0e6b59;--accent-ink:#fff;--danger:#bc4c4c;--shadow:0 22px 70px rgba(35,52,62,.13);--key-shadow:inset 0 -2px 0 rgba(14,31,39,.045),0 1px 1px rgba(255,255,255,.75);--radius:32px}
[data-theme="dark"]{color-scheme:dark;--bg:#101719;--panel:#192226;--panel-2:#202b30;--screen:#192226;--text:#edf4f5;--muted:#9ba9ae;--line:#2b383d;--key:#29363b;--key-hover:#35454a;--fn:#223e39;--accent:#56c9ab;--accent-hi:#6ad8bb;--accent-ink:#072b23;--danger:#ee9292;--shadow:0 24px 70px rgba(0,0,0,.32);--key-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100dvh;background:var(--bg);font-family:Inter,Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;transition:background .2s,color .2s}button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 58%,transparent);outline-offset:3px}button:disabled{opacity:.38;cursor:default}.shell{width:min(100%,990px);min-height:min(760px,calc(100dvh - 48px));display:grid;grid-template-columns:minmax(0,1fr) 292px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.calculator{min-width:0;min-height:0;padding:25px 27px 26px;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;gap:12px;min-height:48px}.brand-icon{width:46px;height:46px;flex:none;border-radius:15px;background:linear-gradient(145deg,var(--accent),var(--accent-hi));color:white;display:grid;place-items:center;box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 24%,transparent)}.brand{font-weight:780;font-size:17px;letter-spacing:-.5px}.tagline{font-size:11px;color:var(--muted);letter-spacing:.2px;margin-top:3px}.top-actions{display:flex;gap:4px;align-items:center}.icon-btn{width:40px;height:40px;border-radius:13px;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background .13s,color .13s,transform .12s}.icon-btn:hover{background:var(--key);color:var(--text)}.icon-btn:active{transform:scale(.93)}.icon-btn svg{width:20px;height:20px}.mobile-only{display:none}.display{min-height:190px;flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;padding:26px 3px 20px;overflow:hidden}.expression-wrap{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:30px}.expression{max-width:100%;text-align:right;overflow-wrap:anywhere;color:var(--muted);font-size:clamp(19px,2.4vw,25px);font-weight:430;line-height:1.5;min-height:1.4em}.expression.empty{opacity:.65}.answer{width:100%;text-align:right;font-size:clamp(46px,6.5vw,72px);font-weight:460;letter-spacing:-2.7px;line-height:1.16;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;transition:color .12s}.answer.preview{color:var(--muted)}.answer.error{font-size:clamp(28px,4vw,42px);letter-spacing:-.8px;color:var(--danger)}.display-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;min-height:21px}.status{font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;font-weight:680}.copy-result{display:flex;align-items:center;gap:5px;color:var(--muted);background:transparent;padding:6px 9px;border-radius:10px;font-size:11px}.copy-result:hover{background:var(--key);color:var(--text)}.copy-result svg{width:14px;height:14px}.memory{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:0 0 12px;padding:5px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.memory button{border-radius:9px;min-height:29px;color:var(--muted);background:transparent;font-size:11px;font-weight:650;letter-spacing:.1px;transition:background .13s,color .13s}.memory button:hover:not(:disabled){background:var(--key);color:var(--text)}.memory button:disabled{opacity:.25}.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.key{position:relative;height:clamp(54px,7.8vh,72px);min-height:49px;border-radius:19px;background:var(--key);color:var(--text);font-size:clamp(20px,2.3vw,25px);font-weight:540;display:grid;place-items:center;box-shadow:var(--key-shadow);user-select:none;transition:background .13s,transform .09s,box-shadow .13s;touch-action:manipulation}.key:hover{background:var(--key-hover)}.key:active{transform:translateY(1px) scale(.975);box-shadow:none}.key.function{background:var(--fn);color:var(--accent);font-size:16px;font-weight:700}.key.function:hover{filter:brightness(.97)}.key.operator{font-size:28px;font-weight:460}.key.active-operator{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 20%,transparent)}.key.equals{background:linear-gradient(150deg,var(--accent),var(--accent-hi));color:var(--accent-ink);font-size:30px;font-weight:450;box-shadow:0 5px 12px color-mix(in srgb,var(--accent) 18%,transparent),var(--key-shadow)}.key.equals:hover{filter:brightness(1.04)}.key.zero{grid-column:span 1}.key svg{width:22px;height:22px}.key.function svg{width:19px;height:19px}.history{min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--panel-2);padding:24px 19px 19px;display:flex;flex-direction:column}.history-head{display:flex;align-items:center;gap:9px;min-height:40px}.history-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:760;letter-spacing:-.2px}.history-title svg{width:19px;height:19px;color:var(--accent)}.history-count{font-size:10px;background:var(--key);padding:3px 7px;border-radius:20px;color:var(--muted);font-weight:700}.history-spacer{flex:1}.clear-history{font-size:11px;color:var(--accent);background:transparent;padding:8px 9px;border-radius:10px;font-weight:650}.clear-history:hover{background:var(--fn)}.history-list{overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:9px;margin-top:15px;padding:1px 2px 3px}.history-item{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 13px 12px;text-align:right;cursor:pointer;transition:border-color .13s,transform .13s,background .13s;width:100%;box-shadow:0 2px 4px rgba(20,40,50,.015)}.history-item:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:translateY(-1px)}.history-expr{color:var(--muted);font-size:12px;line-height:1.45;overflow-wrap:anywhere}.history-result{font-size:21px;font-weight:680;letter-spacing:-.5px;margin-top:4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.history-time{font-size:10px;color:var(--muted);margin-top:6px;text-align:left}.empty-history{color:var(--muted);font-size:12px;line-height:1.65;text-align:center;margin:auto 0;padding:35px 12px}.empty-history svg{width:36px;height:36px;margin:0 auto 12px;opacity:.6}.history-bottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.5}.toast{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,14px);background:var(--text);color:var(--panel);padding:11px 15px;border-radius:13px;font-size:12px;font-weight:570;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:var(--shadow);z-index:30;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}svg{display:block}
@media(max-width:760px){body{padding:0;align-items:stretch}.shell{width:100%;min-height:100dvh;border-radius:0;border:0;box-shadow:none;grid-template-columns:1fr}.calculator{padding:calc(16px + env(safe-area-inset-top)) 17px calc(15px + env(safe-area-inset-bottom));min-height:100dvh}.topbar{gap:10px}.brand-icon{width:42px;height:42px;border-radius:14px}.brand{font-size:16px}.tagline{font-size:10px}.mobile-only{display:grid}.display{min-height:clamp(180px,28vh,285px);padding:20px 2px 19px}.answer{font-size:clamp(48px,12vw,72px)}.memory{margin-bottom:11px}.keypad{gap:9px}.key{height:clamp(54px,9.1vh,78px);border-radius:20px;font-size:25px}.key.operator{font-size:29px}.key.function{font-size:16px}.history{display:none;position:fixed;inset:0;z-index:20;border:0;padding:calc(20px + env(safe-area-inset-top)) 18px calc(17px + env(safe-area-inset-bottom));}.history.open{display:flex}.history-close{display:grid}.history-list{flex:1;max-height:none}.history-bottom{margin-top:12px}}
@media(max-width:370px){.calculator{padding-left:12px;padding-right:12px}.keypad{gap:7px}.key{height:clamp(49px,8.6vh,66px);min-height:47px;border-radius:16px}.display{min-height:165px}.memory button{font-size:10px}.key.function{font-size:14px}}
@media(max-height:690px) and (min-width:761px){body{padding:12px}.shell{min-height:calc(100dvh - 24px)}.calculator{padding:17px 20px}.display{min-height:105px;padding:13px 3px 12px}.answer{font-size:clamp(39px,5.2vw,58px)}.key{height:51px;min-height:45px;border-radius:15px}.keypad{gap:7px}.memory{margin-bottom:8px}.history{padding:18px 15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell" id="app" aria-label="DC Calculator">
<section class="calculator">
  <header class="topbar">
    <div class="brand-icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="4.3" y="2.4" width="15.4" height="19.2" rx="3.1" stroke="currentColor" stroke-width="1.7"/><rect x="7.2" y="5.2" width="9.6" height="3.2" rx=".8" fill="currentColor" opacity=".85"/><path d="M7.5 11.4h1.2m3.3 0h1.2m3.3 0h.1M7.5 14.9h1.2m3.3 0h1.2m3.3 0h.1M7.5 18.1h1.2m3.3 0h1.2m3.3 0h.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
    <div><div class="brand">DC Calculator</div><div class="tagline">Simple · Fast · Accurate</div></div>
    <div style="flex:1"></div>
    <div class="top-actions">
      <button class="icon-btn mobile-only" id="openHistory" aria-label="Open history" title="History"><svg viewBox="0 0 24 24" fill="none"><path d="M3.4 12a8.6 8.6 0 1 0 2.2-5.8L3.4 8.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.5 4.4v4h4m4.5-1.2v5l3.2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch color theme" title="Light/dark theme"><svg id="themeIcon" viewBox="0 0 24 24" fill="none"><path d="M20.2 15.3A8.3 8.3 0 0 1 8.7 3.8 8.6 8.6 0 1 0 20.2 15.3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    </div>
  </header>
  <section class="display" aria-live="polite" aria-atomic="true">
    <div class="expression-wrap"><div class="expression empty" id="expression">Enter a calculation</div></div>
    <div class="answer preview" id="answer">0</div>
    <div class="display-footer"><div class="status" id="status">Ready</div><button class="copy-result" id="copyText" title="Copy answer"><svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V5.7A1.7 1.7 0 0 0 14.3 4H5.7A1.7 1.7 0 0 0 4 5.7v8.6A1.7 1.7 0 0 0 5.7 16H8" stroke="currentColor" stroke-width="1.7"/></svg>Copy result</button></div>
  </section>
  <section class="memory" aria-label="Memory controls">
    <button data-memory="clear" id="memoryClear" disabled>MC</button><button data-memory="recall" id="memoryRecall" disabled>MR</button><button data-memory="add">M+</button><button data-memory="subtract">M−</button><button data-memory="store">MS</button>
  </section>
  <section class="keypad" id="keypad" aria-label="Calculator keypad">
    <button class="key function" data-action="clear" aria-label="All clear">AC</button>
    <button class="key function" data-action="backspace" aria-label="Backspace" title="Backspace"><svg viewBox="0 0 24 24" fill="none"><path d="M9.2 5.5H20v13H9.2L3.8 12l5.4-6.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m12 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <button class="key function" data-action="percent">%</button><button class="key function operator" data-op="/" aria-label="Divide">÷</button>
    <button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button><button class="key function operator" data-op="*" aria-label="Multiply">×</button>
    <button class="key" data-num="4">4</button><button class="key" data-num="5">5</button><button class="key" data-num="6">6</button><button class="key function operator" data-op="-" aria-label="Subtract">−</button>
    <button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key function operator" data-op="+" aria-label="Add">+</button>
    <button class="key function" data-action="sign" aria-label="Change sign">+/−</button><button class="key zero" data-num="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals" aria-label="Equals">=</button>
  </section>
</section>
<aside class="history" id="historyPanel" aria-label="Calculation history">
  <div class="history-head"><div class="history-title"><svg viewBox="0 0 24 24" fill="none"><path d="M3.4 12a8.6 8.6 0 1 0 2.2-5.8L3.4 8.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.5 4.4v4h4m4.5-1.2v5l3.2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>History <span class="history-count" id="historyCount">0</span></div><div class="history-spacer"></div><button class="clear-history" id="clearHistory">Clear</button><button class="icon-btn history-close mobile-only" id="closeHistory" aria-label="Close history"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
  <div class="history-list" id="historyList"></div><div class="history-bottom">Calculations stay on this device.<br>Tip: use your keyboard for faster input.</div>
</aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const expressionEl=$('expression'), answerEl=$('answer'), statusEl=$('status'), keypad=$('keypad'), toastEl=$('toast');
  const HISTORY_KEY='dc-calculator-history-v2', THEME_KEY='dc-calculator-theme-v2', MEMORY_KEY='dc-calculator-memory-v2';
  let expr='', justEvaluated=false, lastAnswer=0, history=[], memory=0, toastTimer=null;
  try { history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); if(!Array.isArray(history))history=[]; history=history.filter(x=>x&&typeof x.e==='string'&&Number.isFinite(x.n)).slice(0,30); } catch {history=[];}
  try {const savedMemory=Number(localStorage.getItem(MEMORY_KEY));if(Number.isFinite(savedMemory))memory=savedMemory;}catch{}
  function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}catch{}}
  function saveMemory(){try{localStorage.setItem(MEMORY_KEY,String(memory));}catch{}}
  function fmt(n){if(!Number.isFinite(n))return 'Error';if(Object.is(n,-0))n=0;const v=Number.parseFloat(n.toPrecision(12));if(Math.abs(v)>=1e12 || (Math.abs(v)>0&&Math.abs(v)<1e-7))return v.toExponential(6).replace(/\.0+e/,'e');return v.toLocaleString('en-US',{maximumFractionDigits:10,useGrouping:true});}
  function pretty(s){return String(s).replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/-/g,' − ').replace(/\s+/g,' ').trim();}
  function parse(source){
    let s=String(source).replace(/\s+/g,'');
    if(!s)return 0;
    // Implicit multiplication is supported: 2(3+4), (2+3)(4), 2π is intentionally not supported.
    s=s.replace(/(\d|\))(?=\()/g,'$1*').replace(/\)(?=\d)/g,')*');
    const tokens=[];let i=0;
    while(i<s.length){const ch=s[i];
      if(/[0-9.]/.test(ch)){let raw='',dots=0;while(i<s.length&&/[0-9.]/.test(s[i])){if(s[i]==='.')dots++;raw+=s[i++];}if(dots>1||raw==='.'||!Number.isFinite(Number(raw)))throw Error('Invalid number');tokens.push({t:'n',v:Number(raw)});continue;}
      if('+-*/()%'.includes(ch)){tokens.push({t:ch});i++;continue;}throw Error('Invalid input');
    }
    let p=0;
    function primary(){let t=tokens[p];if(!t)throw Error('Incomplete');let out;
      if(t.t==='+'||t.t==='-'){p++;out=primary();if(t.t==='-')out={v:-out.v,pc:out.pc};}
      else if(t.t==='n'){p++;out={v:t.v,pc:false};}
      else if(t.t==='('){p++;const v=sum();if(tokens[p]?.t!==')')throw Error('Bracket');p++;out={v,pc:false};}
      else throw Error('Incomplete');
      while(tokens[p]?.t==='%'){p++;out={v:out.v,pc:true};}
      return out;
    }
    function product(){let a=primary();while(tokens[p]&&(tokens[p].t==='*'||tokens[p].t==='/')){const op=tokens[p++].t,b=primary();const av=a.pc?a.v/100:a.v;const bv=b.pc?b.v/100:b.v;let v=op==='*'?av*bv:av/bv;if(!Number.isFinite(v))throw Error('Math error');a={v,pc:false};}return a;}
    function sum(){let a=product();if(a.pc)a={v:a.v/100,pc:false};while(tokens[p]&&(tokens[p].t==='+'||tokens[p].t==='-')){const op=tokens[p++].t;let b=product();const n=b.pc?a.v*b.v/100:b.v;let v=op==='+'?a.v+n:a.v-n;if(!Number.isFinite(v))throw Error('Math error');a={v,pc:false};}return a.v;}
    if(!tokens.length)return 0;const result=sum();if(p<tokens.length)throw Error('Invalid expression');if(!Number.isFinite(result))throw Error('Math error');return result;
  }
  function isIncomplete(s){return !s||/[+\-*/.(]$/.test(s)||/^-?$/.test(s)||/\($/.test(s);}
  function show(){
    expressionEl.textContent=expr?pretty(expr):'Enter a calculation';expressionEl.classList.toggle('empty',!expr);
    let result=0,invalid=false,incomplete=false;
    try{result=expr?parse(expr):0;if(expr&&isIncomplete(expr))incomplete=true;}catch{invalid=true;incomplete=!!expr&&isIncomplete(expr);}
    answerEl.classList.remove('error');
    if(invalid&&!incomplete){answerEl.textContent=justEvaluated?'Error':'';answerEl.classList.add('preview');statusEl.textContent='';}
    else if(incomplete){answerEl.textContent='';answerEl.classList.add('preview');statusEl.textContent='';}
    else{answerEl.textContent=fmt(result);answerEl.classList.toggle('preview',!justEvaluated);statusEl.textContent=justEvaluated?'Calculated':(expr?'Preview':'Ready');}
    if(justEvaluated){answerEl.textContent=fmt(lastAnswer);answerEl.classList.remove('preview');}
    keypad.querySelectorAll('[data-op]').forEach(b=>b.classList.toggle('active-operator',!justEvaluated&&expr.endsWith(b.dataset.op)));
    $('historyCount').textContent=String(history.length);updateMemoryButtons();
  }
  function feedback(){try{if(navigator.vibrate&&matchMedia('(pointer:coarse)').matches)navigator.vibrate(7);}catch{}}
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800);}
  function currentResult(){try{if(justEvaluated)return lastAnswer;if(!expr||isIncomplete(expr))return null;const n=parse(expr);return Number.isFinite(n)?n:null;}catch{return null;}}
  function pushDigit(v){feedback();if(justEvaluated){expr='';justEvaluated=false;}if(expr==='0')expr=v;else if(expr==='-0')expr='-'+v;else if(/\)%?$/.test(expr))expr+='*'+v;else expr+=v;show();}
  function operator(op){feedback();if(justEvaluated){expr=String(lastAnswer);justEvaluated=false;}if(!expr){if(op!=='-')return;expr='-';show();return;}if(/[+\-*/]$/.test(expr)){if(expr.length===1&&expr==='-'&&op!=='-')return;expr=expr.slice(0,-1)+op;}else expr+=op;show();}
  function decimal(){feedback();if(justEvaluated){expr='0.';justEvaluated=false;show();return;}if(/\)$/.test(expr)||/%$/.test(expr)){expr+='*0.';show();return;}const tail=(expr.match(/(?:^|[+*/(]|(?<!\*)-)(\d*\.?\d*)$/)||[])[1];if(tail&&tail.includes('.'))return;if(!expr||/[+\-*/(]$/.test(expr))expr+='0.';else expr+='.';show();}
  function paren(){feedback();if(justEvaluated){expr='';justEvaluated=false;}const opens=(expr.match(/\(/g)||[]).length,closes=(expr.match(/\)/g)||[]).length;if(!expr||/[+\-*/(]$/.test(expr))expr+='(';else if(opens>closes)expr+=')';else expr+='*(';show();}
  function percent(){feedback();if(justEvaluated){expr=String(lastAnswer);justEvaluated=false;}if(!expr||/[+\-*/(]$/.test(expr)||/%$/.test(expr))return;expr+='%';show();}
  function toggleSign(){feedback();if(justEvaluated){expr=String(-lastAnswer);lastAnswer=-lastAnswer;justEvaluated=false;show();return;}const m=expr.match(/(\d*\.?\d+%?)$/);if(m){const start=expr.length-m[1].length,prefix=expr.slice(0,start),tail=m[1];if(prefix.endsWith('(-'))expr=prefix.slice(0,-2)+'('+tail;else if(prefix.endsWith('-')&&(prefix.length===1||/[+\-*/(]$/.test(prefix.slice(0,-1))))expr=prefix.slice(0,-1)+tail;else expr=prefix+'(-'+tail+')';}else if(expr){expr='-('+expr+')';}else expr='-';justEvaluated=false;show();}
  function backspace(){feedback();if(justEvaluated){expr=String(lastAnswer);justEvaluated=false;}if(expr)expr=expr.slice(0,-1);show();}
  function clear(){feedback();expr='';justEvaluated=false;lastAnswer=0;show();}
  function addHistory(e,n){if(!e)return;history.unshift({e,n,at:Date.now()});history=history.slice(0,30);saveHistory();renderHistory();}
  function renderHistory(){const root=$('historyList');root.replaceChildren();$('historyCount').textContent=String(history.length);if(!history.length){const empty=document.createElement('div');empty.className='empty-history';empty.innerHTML='<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>No calculations yet.<br>Your recent results will appear here.';root.append(empty);return;}for(const item of history){const btn=document.createElement('button');btn.className='history-item';btn.type='button';const e=document.createElement('div');e.className='history-expr';e.textContent=pretty(item.e)+' =';const n=document.createElement('div');n.className='history-result';n.textContent=fmt(item.n);const at=document.createElement('div');at.className='history-time';at.textContent=new Date(item.at||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});btn.append(e,n,at);btn.addEventListener('click',()=>{expr=String(item.n);lastAnswer=item.n;justEvaluated=true;show();$('historyPanel').classList.remove('open');});root.append(btn);}}
  function equals(){feedback();if(!expr)return;try{const original=expr,n=parse(expr);if(!Number.isFinite(n))throw Error('Math error');lastAnswer=n;addHistory(original,n);expr=String(Number(n.toPrecision(12)));justEvaluated=true;show();statusEl.textContent='Calculated';}catch{answerEl.textContent='Cannot calculate';answerEl.classList.remove('preview');answerEl.classList.add('error');statusEl.textContent='Check expression';toast('Please check the expression');}}
  function updateMemoryButtons(){const has=memory!==0;$('memoryClear').disabled=!has;$('memoryRecall').disabled=!has;}
  function memoryAction(action){const value=currentResult();switch(action){case'clear':memory=0;break;case'recall':if(memory!==0){if(justEvaluated||!expr){expr=String(memory);justEvaluated=false;}else if(/[+\-*/(]$/.test(expr)){expr+=String(memory);}else{expr+='*'+String(memory);}show();}break;case'add':if(value===null){toast('Enter a valid calculation first');return;}memory+=value;break;case'subtract':if(value===null){toast('Enter a valid calculation first');return;}memory-=value;break;case'store':if(value===null){toast('Enter a valid calculation first');return;}memory=value;break;}saveMemory();updateMemoryButtons();toast(action==='clear'?'Memory cleared':action==='recall'?'Memory recalled':'Memory updated');}
  async function copyResult(){const value=currentResult();if(value===null){toast('No valid result to copy');return;}try{await navigator.clipboard.writeText(String(value));toast('Result copied');}catch{const ta=document.createElement('textarea');ta.value=String(value);ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'Result copied':'Copy is unavailable in this browser');}}
  keypad.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.num!==undefined){pushDigit(b.dataset.num);return;}if(b.dataset.op){operator(b.dataset.op);return;}switch(b.dataset.action){case'clear':clear();break;case'backspace':backspace();break;case'decimal':decimal();break;case'sign':toggleSign();break;case'percent':percent();break;case'paren':paren();break;case'equals':equals();break;}});
  document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;if(/^[0-9]$/.test(k)){pushDigit(k);e.preventDefault();}else if(k==='.'){decimal();e.preventDefault();}else if(['+','-','*','/'].includes(k)){operator(k);e.preventDefault();}else if(k==='%'){percent();e.preventDefault();}else if(k==='('||k===')'){feedback();if(k==='('){if(justEvaluated){expr='';justEvaluated=false;}if(expr&&/[\d)%]$/.test(expr))expr+='*';expr+='(';}else{const opens=(expr.match(/\(/g)||[]).length,closes=(expr.match(/\)/g)||[]).length;if(opens>closes&&!/[+\-*/(]$/.test(expr))expr+=')';}show();e.preventDefault();}else if(k==='Enter'||k==='='){equals();e.preventDefault();}else if(k==='Backspace'){backspace();e.preventDefault();}else if(k==='Escape'||k==='Delete'){clear();e.preventDefault();}});
  $('clearHistory').addEventListener('click',()=>{history=[];saveHistory();renderHistory();toast('History cleared');});
  $('themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem(THEME_KEY,dark?'dark':'light');}catch{}$('themeIcon').innerHTML=dark?'<circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>':'<path d="M20.2 15.3A8.3 8.3 0 0 1 8.7 3.8 8.6 8.6 0 1 0 20.2 15.3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>';document.querySelector('meta[name="theme-color"]').content=dark?'#101719':'#f2f4f6';});
  $('copyText').addEventListener('click',copyResult);
  $('openHistory').addEventListener('click',()=>$('historyPanel').classList.add('open'));$('closeHistory').addEventListener('click',()=>$('historyPanel').classList.remove('open'));
  document.querySelectorAll('[data-memory]').forEach(b=>b.addEventListener('click',()=>memoryAction(b.dataset.memory)));
  try{if(localStorage.getItem(THEME_KEY)==='dark'){$('themeBtn').click();}}catch{}
  renderHistory();show();
  // Read-only test hooks for automated regression checks; no calculator state is changed by exposing these.
  window.DCCalculatorTest={parse,fmt,pretty};
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
