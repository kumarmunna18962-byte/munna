const KEY='dc_chat_v6';let dcTab='tab_'+Math.random().toString(36).slice(2);setInterval(checkTyping,700);window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith('dc_typing_'))checkTyping()});let data;try{const raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):null}catch(e){data=null;try{localStorage.removeItem(KEY)}catch(_){}}data=data||{profile:{name:'You',avatar:'',phone:'',about:'Hey there! I am using DC Chat.',sound:true,dark:false,notify:false,callNotify:true,notifSound:true,preview:true,securityNotify:true,blockUnknown:false,unknownMessages:true,startAtLogin:true,enterSends:true,vibrate:true,language:'English',fontSize:100,ringtone:'classic',ringVolume:80,mediaQuality:'Auto',defaultWall:'default'},privacy:{lastSeen:'Everyone',profilePic:'Everyone',about:'Everyone',status:'My contacts',timer:'Off',groups:'Everyone',blocked:[]},chats:[],calls:[],statuses:[]};

(data.statuses||[]).forEach(x=>{if(!Array.isArray(x.views))x.views=[]});
let active=null,currentTab='chats',stream=null,rec=null,recordStart=0,callTimer=null,ringTimer=null,callMuted=false,callSpeaker=true;

data.profile={name:'You',avatar:'',phone:'',about:'Hey there! I am using DC Chat.',sound:true,dark:false,notify:false,callNotify:true,notifSound:true,preview:true,securityNotify:true,blockUnknown:false,unknownMessages:true,startAtLogin:true,enterSends:true,vibrate:true,language:'English',fontSize:100,ringtone:'classic',ringVolume:80,mediaQuality:'Auto',defaultWall:'default',paymentBalance:0,subscription:'Free',appIcon:'DC',...(data.profile||{})};data.privacy={lastSeen:'Everyone',profilePic:'Everyone',about:'Everyone',status:'My contacts',timer:'Off',groups:'Everyone',blocked:[],...(data.privacy||{})};data.channels=data.channels||[{id:'ch1',name:'DC Gaming',about:'100 AI video par day banao 😎👍',date:'Yesterday',following:true,avatar:'',unread:0},{id:'ch2',name:'Tech Updates',about:'New apps, games and useful tips',date:'06/10/26',following:false,avatar:'',unread:4},{id:'ch3',name:'AI Creators',about:'Camera, AI video and creator ideas',date:'04/10/26',following:false,avatar:'',unread:14}];data.communities=data.communities||[];data.broadcasts=data.broadcasts||[]; function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
function avatar(name,src=''){return src||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#dfe5e7"/><text x="50" y="60" text-anchor="middle" font-size="44" fill="#667781">${(name||'?')[0].toUpperCase()}</text></svg>`)}
let audioCtx=null;
function unlockAudio(){try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioCtx=audioCtx||new A();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{once:true});
function beep(type='send'){if(!data.profile.sound)return;try{unlockAudio();if(!audioCtx)return;let now=audioCtx.currentTime;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==='ring'?'sine':'sine';if(type==='ring'){o.frequency.setValueAtTime(520,now);o.frequency.linearRampToValueAtTime(680,now+.16)}else o.frequency.setValueAtTime(type==='receive'?560:740,now);let vol=Math.max(.015,Math.min(.09,(Number(data.profile.ringVolume??80)/100)*.07));g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+(type==='ring'?.42:.18));o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+(type==='ring'?.45:.19))}catch(e){}}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),2200)}

function openOverflowMenu(kind='chats'){document.getElementById('dcOverflow')?.remove();let m=document.createElement('div');m.id='dcOverflow';m.className='overflow-menu';let items=kind==='chats'?[['New group','createGroup()'],['New community','newCommunity()'],['Broadcast lists','broadcastLists()'],['Linked devices','linkedDevices()'],['Starred','globalStarred()'],['Payments','openPayments()'],['Read all','readAllChats()'],['Settings','openSettings()']]:kind==='calls'?[['Call settings','openSettings(\'voice\')'],['Clear call history','clearCallHistory()'],['Settings','openSettings()']]:kind==='status'?[['Create channel','createChannel()'],['Status privacy','openSettings(\'privacy\')'],['Settings','openSettings()']]:[['New community','newCommunity()'],['Join community','joinCommunity()'],['Settings','openSettings()']];m.innerHTML=items.map(x=>`<button onclick="${x[1]};this.parentElement.remove()">${x[0]}</button>`).join('');document.body.appendChild(m);setTimeout(()=>document.addEventListener('click',closeOverflow,{once:true}),0)}

function createChannel(){let n=prompt('Channel name');if(!n)return;data.channels.unshift({id:'ch'+Date.now(),name:n,about:'New DC Chat channel',date:'Today',following:true,avatar:'',unread:0});save();render();toast('Channel created ✓')}
function toggleChannelFollow(id){let c=(data.channels||[]).find(x=>x.id===id);if(!c)return;c.following=!c.following;c.muted=false;save();render();toast(c.following?'Following channel ✓':'Unfollowed channel')}

function shareChannel(id){let c=(data.channels||[]).find(x=>x.id===id);if(!c)return;let link='dcchat://channel/'+id; if(navigator.clipboard)navigator.clipboard.writeText(link).catch(()=>{});toast('Channel link copied ✓')}
function openChannel(id){let c=(data.channels||[]).find(x=>x.id===id);if(!c)return;c.posts=c.posts||[{id:'p1',text:c.about||'Welcome to this DC Chat channel.',time:Date.now()}];let posts=c.posts.map(p=>`<div class="channel-post"><div class="channel-post-meta"><img class="avatar" style="width:38px;height:38px" src="${avatar(c.name,c.avatar)}"><div><b>${esc(c.name)}</b><small>${new Date(p.time).toLocaleString()}</small></div></div><div class="channel-post-text">${esc(p.text||'')}</div><div class="channel-post-actions"><button onclick="toast('❤️ Reaction sent')">❤️</button><button onclick="shareChannel('${id}')">↗ Share</button></div></div>`).join('');openModal('',`<div class="channel-screen"><div class="channel-cover"><img class="avatar" src="${avatar(c.name,c.avatar)}"><div><h2>${esc(c.name)} ${c.following?'✓':''}</h2><p>${esc(c.about||'DC Chat channel')}</p></div></div><div class="channel-actions"><button class="primary" onclick="toggleChannelFollow('${id}');openChannel('${id}')">${c.following?'Following':'Follow'}</button><button onclick="toggleChannelMute('${id}')">${c.muted?'Unmute':'🔔 Mute'}</button><button onclick="shareChannel('${id}')">↗ Share</button></div><div class="channel-posts">${posts}</div><div class="channel-note">ℹ️ Channel posts are stored in this browser only; they are not synced to other accounts yet.</div></div>`)}
function exploreChannels(){openModal('Explore channels',`<div class="settings">${(data.channels||[]).map(c=>`<button class="setting-item" onclick="followChannel('${c.id}');closeModal()"><img class="avatar" style="width:44px;height:44px" src="${avatar(c.name,c.avatar)}"><span class="si-main"><b>${esc(c.name)}</b><div class="si-sub">${esc(c.about)}</div></span><span>${c.following?'Following':'Follow'}</span></button>`).join('')}</div>`)}
function searchChannels(){let q=prompt('Search channels');if(q!==null){document.getElementById('search').value=q;render()}}
function newCommunity(){openModal('New community',`<input id="communityName" class="field" placeholder="Community name"><textarea id="communityAbout" class="field" placeholder="Description"></textarea><button class="primary" onclick="saveCommunity()">Create community</button>`)}
function saveCommunity(){let n=document.getElementById('communityName').value.trim();if(!n)return toast('Enter a community name');data.communities.unshift({id:'cm'+Date.now(),name:n,about:document.getElementById('communityAbout').value.trim()||'My DC Chat community',groups:[]});save();closeModal();render();toast('Community created ✓')}
function joinCommunity(){let n=prompt('Enter community invite/code');if(!n)return;data.communities.unshift({id:'cm'+Date.now(),name:'Joined: '+n,about:'Joined community',groups:[]});save();render();toast('Community joined ✓')}
function openCommunity(id){let c=data.communities.find(x=>x.id===id);if(!c)return;openModal(c.name,`<div class="community-card"><h3>${esc(c.name)}</h3><p>${esc(c.about)}</p><button class="primary" onclick="createCommunityGroup('${id}')">＋ Add group</button></div>`)}
function createCommunityGroup(id){let c=data.communities.find(x=>x.id===id);if(!c)return;let n=prompt('Group name');if(!n)return;c.groups=c.groups||[];c.groups.push(n);save();openCommunity(id);toast('Group added ✓')}
function startNewCall(){if(!data.chats.length)return toast('Create a contact first');let c=data.chats[0];openChat(c.id);setTimeout(()=>startCall(false),100)}
function scheduleCall(){openModal('Schedule call',`<input id="scheduleWho" class="field" placeholder="Contact name"><input id="scheduleDate" class="field" type="datetime-local"><button class="primary" onclick="saveSchedule()">Schedule</button>`)}
function saveSchedule(){let who=document.getElementById('scheduleWho').value.trim()||'Contact';let dt=document.getElementById('scheduleDate').value||new Date().toISOString().slice(0,16);data.scheduledCalls=data.scheduledCalls||[];data.scheduledCalls.push({who,dt});save();closeModal();toast('Call scheduled for '+new Date(dt).toLocaleString())}
function openKeypad(){openModal('Keypad',`<div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button onclick="document.getElementById('dialNumber').value+= '${n}'">${n}</button>`).join('')}</div><input id="dialNumber" class="field" placeholder="Phone number" inputmode="tel"><button class="primary" style="width:100%" onclick="dialNumber()">☎ Call</button>`)}
function dialNumber(){let n=document.getElementById('dialNumber').value.trim();if(!n)return toast('Enter a number');let c=data.chats.find(x=>x.phone===n);if(c){closeModal();openChat(c.id);startCall(false)}else toast('Number is not in your contacts')}
function searchCalls(){let q=prompt('Search calls');if(q!==null){document.getElementById('search').value=q;render()}}
function searchCommunities(){let q=prompt('Search communities');if(q!==null){document.getElementById('search').value=q;render()}}
function clearCallHistory(){if(confirm('Clear call history?')){data.calls=[];save();render();toast('Call history cleared')}}
let activeStatusIndex=-1;let storyTimer=null;
function statusViewers(x){return Array.isArray(x.views)?x.views.length:Number(x.views||0)}
function viewStatus(i){let st=data.statuses||[],x=st[i];if(!x)return;activeStatusIndex=i;if(!Array.isArray(x.views))x.views=[];let viewerKey='this-device';if(!x.views.includes(viewerKey))x.views.push(viewerKey);save();renderStoryViewer();startStoryTimer()}
function renderStoryViewer(){let st=data.statuses||[],x=st[activeStatusIndex];if(!x){closeModal();return}let total=st.length,prev=activeStatusIndex>0?activeStatusIndex-1:-1,next=activeStatusIndex<total-1?activeStatusIndex+1:-1;let bg=x.src?`background-image:url(\"${x.src}\");background-size:cover;background-position:center`:'';let seg=st.map((_,n)=>`<span class="${n<activeStatusIndex?'done ':''}${n===activeStatusIndex?'current':''}"><i></i></span>`).join('');openModal('',`<div class="status-viewer" style="${bg}"><div class="story-progress">${seg}</div><div class="story-tap left" onclick="previousStatus()"></div><div class="story-tap right" onclick="nextStatus()"></div><div class="status-top"><img class="avatar" src="${avatar(data.profile.name,data.profile.avatar)}"><div><b>My status</b><small>${new Date(x.time).toLocaleString()}</small><span class="story-viewers">👁 ${statusViewers(x)} view${statusViewers(x)==1?'':'s'}</span></div><button onclick="closeStory()">✕</button><button class="story-more" onclick="toggleStoryMenu(event)">⋮</button></div><div class="status-content">${x.src?'':`<div class="status-text">${esc(x.text||'')}</div>`}${x.src&&x.text?`<div class="status-caption">${esc(x.text)}</div>`:''}</div><div class="status-bottom"><button onclick="toast('Reply to status')">↩ Reply</button><button onclick="toast('❤️ Reaction sent')">❤️</button><button onclick="showStatusViewers()">👁 ${statusViewers(x)}</button></div><div id="storyMenu" class="story-menu" style="display:none"><button onclick="showStatusViewers()">👁 Viewers (${statusViewers(x)})</button><button class="story-delete" onclick="deleteStatus()">🗑 Delete status</button><button onclick="closeStory()">✕ Close</button></div></div>`)}
function startStoryTimer(){clearTimeout(storyTimer);storyTimer=setTimeout(()=>{if(activeStatusIndex<(data.statuses||[]).length-1)nextStatus();else closeStory()},5000)}
function previousStatus(){if(activeStatusIndex>0){activeStatusIndex--;viewStatus(activeStatusIndex)}}
function nextStatus(){if(activeStatusIndex<(data.statuses||[]).length-1){activeStatusIndex++;viewStatus(activeStatusIndex)}else closeStory()}
function closeStory(){clearTimeout(storyTimer);activeStatusIndex=-1;closeModal()}
function toggleStoryMenu(e){e.stopPropagation();let m=document.getElementById('storyMenu');if(m)m.style.display=m.style.display==='none'?'block':'none'}
function showStatusViewers(){let x=(data.statuses||[])[activeStatusIndex];if(!x)return;let n=statusViewers(x);openModal('Status viewers',`<div class="empty" style="height:220px"><div><div style="font-size:44px">👁</div><strong>${n} view${n==1?'':'s'}</strong><p>${n?'This device viewed your status. Other viewers will appear here when the app is connected to other users.':'No viewers yet.'}</p></div></div>`)}
function deleteStatus(){let i=activeStatusIndex;if(i<0)return;let x=(data.statuses||[])[i];if(!confirm('Delete this status?'))return;data.statuses.splice(i,1);save();clearTimeout(storyTimer);activeStatusIndex=-1;closeModal();render();toast('Status deleted ✓')}
function deleteLatestStatus(){let st=data.statuses||[];if(!st.length)return toast('No status to delete');let i=st.length-1;if(!confirm('Delete your latest status?'))return;st.splice(i,1);save();render();toast('Status deleted ✓')}
function lastTime(c){let m=c.messages.at(-1);return m?new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}
function newChat(){openModal('Contacts & new chat',`<button class="primary" style="width:100%;margin-bottom:8px" onclick="importPhoneContacts()">📱 Import contacts from phone</button><div style="font-size:12px;color:#667781;margin-bottom:10px">Phone contact access works only in supported browsers after you allow permission. Otherwise add your family/friends below.</div><input id="newUid" class="field" placeholder="Friend DC UID (e.g. DCAB12CD)"><button class="primary" onclick="addOnlineFriend()">🔎 Find DC Chat friend</button><div style="text-align:center;margin:12px;color:#667781">or add a phone contact</div><input id="newName" class="field" placeholder="Name (e.g. Papa / Mummy / Friend)"><input id="newPhone" class="field" type="tel" placeholder="Phone number"><button class="primary" onclick="createChat()">＋ Save contact</button><div style="font-size:12px;color:#667781;margin-top:10px">Note: saving a phone contact creates a local contact entry; to message them online, they also need a DC Chat account and UID.</div>`)}
async function importPhoneContacts(){if(!('contacts' in navigator)||!navigator.contacts?.select){toast('This browser does not support phone contact import. Use Chrome on a supported Android phone, or add contacts manually.');return}try{const picked=await navigator.contacts.select(['name','tel'],{multiple:true});let added=0;for(const p of picked){const name=(p.name||[])[0]?.trim(),phone=(p.tel||[])[0]?.trim();if(!name&&!phone)continue;if(data.chats.some(x=>phone&&x.phone===phone))continue;data.chats.unshift({id:'c'+Date.now()+Math.random().toString(36).slice(2,5),name:name||phone,phone:phone||'',avatar:'',typing:false,unread:0,muted:false,messages:[]});added++}save();render();closeModal();toast(added?added+' contact(s) imported ✓':'No new contacts selected')}catch(e){toast('Contact import cancelled or permission denied. You can add contacts manually.')}}
async function addOnlineFriend(){let uid=(document.getElementById('newUid')?.value||'').trim().toUpperCase();if(!uid)return toast('Enter friend DC UID');if(!onlineToken||!onlineUser)return toast('Please log in to save real contacts');try{let r=await apiFetch('/api/contacts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})});let u=await r.json().catch(()=>({}));if(!r.ok)return toast(u.error||'Could not save contact');let c=data.chats.find(x=>x.peerUid===u.uid);if(!c){c={id:'c'+Date.now(),name:u.name,phone:u.email,avatar:'',peerUid:u.uid,typing:false,unread:0,muted:false,messages:[]};data.chats.unshift(c)}else{c.name=u.name;c.phone=u.email}save();closeModal();openChat(c.id);await syncOnlineMessages(c);toast('Real DC Chat contact saved to your account ✓')}catch(e){toast('Server connection failed; contact was not saved')}}
function createChat(){let n=document.getElementById('newName').value.trim(),p=document.getElementById('newPhone').value.trim();if(!n)return toast('Enter a contact name');let c={id:'c'+Date.now(),name:n,phone:p,avatar:'',typing:false,unread:0,muted:false,messages:[]};data.chats.unshift(c);save();closeModal();openChat(c.id);toast('Local chat created')}
function openChat(id){
 if(active)clearTyping();active=data.chats.find(c=>c.id===id);if(!active)return;clearTyping();active.unread=0;save();
 const mobile=window.matchMedia('(max-width:800px)').matches;
 if(mobile&&!window.__dcNavPop)history.pushState({dcLayer:'chat',chatId:id},'',location.href.split('#')[0]+'#chat');
 document.getElementById('welcome').style.display='none';document.getElementById('chat').style.display='flex';document.getElementById('app').classList.add('chatopen');document.getElementById('chatAvatar').src=avatar(active.name,active.avatar);document.getElementById('chatName').textContent=active.name;document.getElementById('chatStatus').textContent=active.typing?'typing…':'online';renderMessages();render();if(onlineMode&&active.peerUid)syncOnlineMessages(active)
}
function closeChat(fromPop=false){
 if(!fromPop&&window.matchMedia('(max-width:800px)').matches&&history.state?.dcLayer==='chat'){history.back();return}
 clearTyping();active=null;document.getElementById('app').classList.remove('chatopen');document.getElementById('chat').style.display='none';document.getElementById('welcome').style.display='grid'
}
function renderMessages(){let box=document.getElementById('messages');if(!active)return;box.innerHTML=active.messages.length?active.messages.map((m,i)=>`<div class="bubble ${m.out?'out':'in'}" oncontextmenu="messageMenu(event,'${m.id}')">${m.reply?`<div class="replybox">${esc(m.reply)}</div>`:''}${m.type==='photo'?`<img class="photo" src="${m.src}">`:m.type==='audio'?`<audio controls src="${m.src}"></audio>`:`<span class="body">${esc(m.text||'')}</span>`}${m.starred?' <span title="Starred">⭐</span>':''}${m.pinned?' <span title="Pinned">📌</span>':''}${m.edited?' <small style="opacity:.65">edited</small>':''}<span class="meta">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${m.out?`<span class="ticks">${m.read?'✓✓':'✓'}</span>`:''}</span></div>`).join(''):`<div class="empty"><div><strong>Say hello 👋</strong>Messages you send here stay in this browser.</div></div>`;box.scrollTop=box.scrollHeight}
async function sendText(){if(!active)return toast('Create or open a chat first');let x=document.getElementById('composer'),t=x.value.trim();if(!t)return;if(onlineMode&&active.peerUid){try{let r=await apiFetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:active.peerUid,text:t})});if(!r.ok)throw new Error('send failed');let m=await r.json();m.out=true;m.read=false;active.messages.push(m);x.value='';autoGrow(x);active.unread=0;clearTyping();save();beep('send');renderMessages();render();return}catch(e){return toast('Message could not be sent — check connection')}}let m={id:'m'+Date.now(),text:t,time:Date.now(),out:true,read:false};active.messages.push(m);x.value='';autoGrow(x);active.unread=0;clearTyping();save();beep('send');renderMessages();render();setTimeout(()=>{m.read=true;save();renderMessages()},650)}
function setTyping(){if(!active)return;localStorage.setItem('dc_typing_'+active.id,JSON.stringify({tab:dcTab,time:Date.now()}));if(dcSocket&&active.peerUid)dcSocket.emit('typing',{to:active.peerUid,typing:true});checkTyping()}
function clearTyping(){if(!active)return;let k='dc_typing_'+active.id;try{let v=JSON.parse(localStorage.getItem(k)||'null');if(v&&v.tab===dcTab)localStorage.removeItem(k)}catch(e){}if(dcSocket&&active.peerUid)dcSocket.emit('typing',{to:active.peerUid,typing:false})}
function checkTyping(){if(!active)return;let k='dc_typing_'+active.id,v=null;try{v=JSON.parse(localStorage.getItem(k)||'null')}catch(e){}let isOther=!!(v&&v.tab!==dcTab&&Date.now()-v.time<2500);document.getElementById('chatStatus').textContent=isOther?'typing…':'online';active.typing=isOther;render();}
function sendDemo(t){if(t==='📍 Location')return shareCurrentLocation();if(t==='👤 Contact shared')return shareContactCard();document.getElementById('composer').value=t;sendText()}
function keySend(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}else setTyping();toggleSend()}
function autoGrow(x){x.style.height='auto';x.style.height=Math.min(x.scrollHeight,110)+'px';toggleSend();if(x.value.trim())setTyping();else clearTyping()}

function toggleSend(){let v=document.getElementById('composer').value.trim();document.getElementById('send').style.display=v?'grid':'none';document.getElementById('mic').style.display=v?'none':'grid'}
function toggleAttach(){document.getElementById('attachmenu').classList.toggle('open')}
function toggleEmoji(){let e=document.getElementById('emoji');e.style.display=e.style.display==='none'?'grid':'none'}

async function cameraButton(){

  const mobile=window.matchMedia('(max-width:800px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

async function syncOnlineContacts(){if(!onlineToken||!onlineUser)return;try{const r=await apiFetch('/api/contacts');if(!r.ok)return;const list=await r.json();for(const u of list){let c=data.chats.find(x=>x.peerUid===u.uid);if(!c)data.chats.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,5),name:u.name,phone:u.email,avatar:'',peerUid:u.uid,typing:false,unread:0,muted:false,messages:[]});else{c.name=u.name;c.phone=u.email}}save();render()}catch(e){console.warn('Contact sync failed')}}\nfunction connectOnline(){if(!onlineToken||typeof io!=='function')return;syncOnlineContacts();try{if(dcSocket)dcSocket.disconnect();dcSocket=io({auth:{token:onlineToken},transports:['websocket','polling']});dcSocket.on('ready',()=>toast('Online ✓ '+(onlineUser?.uid||'')));dcSocket.on('message:new',async m=>{let c=data.chats.find(x=>x.peerUid===m.from);if(!c){try{let r=await apiFetch('/api/users/'+encodeURIComponent(m.from));let u=r.ok?await r.json():{uid:m.from,name:m.from};c={id:'c'+Date.now(),name:u.name||m.from,phone:u.email||'',avatar:'',peerUid:m.from,typing:false,unread:0,muted:false,messages:[]};data.chats.unshift(c)}catch(e){c={id:'c'+Date.now(),name:m.from,peerUid:m.from,messages:[],unread:0,muted:false}}}m.out=false;m.read=active&&active.peerUid===m.from;c.messages.push(m);c.unread=active&&active.id===c.id?0:(c.unread||0)+1;save();if(active&&active.id===c.id){renderMessages();if(dcSocket)dcSocket.emit('read',{id:m.id})}render();if(!c.muted)notify(c.name,m.text||'New message');beep('receive')});dcSocket.on('message:read',({id})=>{for(const c of data.chats)for(const m of c.messages)if(m.id===id)m.read=true;save();renderMessages()});dcSocket.on('typing',({from,typing})=>{let c=data.chats.find(x=>x.peerUid===from);if(c)c.typing=typing;if(active&&active.peerUid===from)document.getElementById('chatStatus').textContent=typing?'typing…':'online';render()});dcSocket.on('connect_error',()=>toast('Online connection lost'))}catch(e){}}
