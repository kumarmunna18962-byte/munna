name: Build DC Calculator Native Android App

on:
  push:
    branches:
      - dc-calculator-android-playstore
    paths:
      - "android-playstore/**"
      - ".github/workflows/dc-calculator-android-aab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-android:
    name: Build native Android APK and Play Store bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable debug APK and Play Store bundle
        run: gradle -p android-playstore --no-daemon clean assembleDebug bundleRelease

      - name: Upload installable APK and unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: dc-calculator-native-android-builds
          path: |
            android-playstore/app/build/outputs/apk/debug/app-debug.apk
            android-playstore/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Publish test APK as a downloadable pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-apk-${{ github.run_number }}-${{ github.run_attempt }}
          name: DC Calculator Native Android APK (Test Build ${{ github.run_number }})
          body: |
            Installable test APK for DC Calculator.
            
            This version uses native Android Java views and a native expression calculator. It is a sideload testing build signed with the generated debug key. It is not the signed Play Store release build.
            
            The AAB, if needed for Play Console, is unsigned until the owner's release keystore is configured securely.
          prerelease: true
          files: android-playstore/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
